    <text x="28" y="82" fill="#ede9fe" font-family="Arial, Helvetica, sans-serif" font-size="22">Detects fragmented identities across regions</text>
    <text x="28" y="118" fill="#ddd6fe" font-family="Arial, Helvetica, sans-serif" font-size="20">Finds risk gapping and arbitrage patterns</text>
    <text x="28" y="152" fill="#ddd6fe" font-family="Arial, Helvetica, sans-serif" font-size="20">Single Client View with confidence scoring</text>
