    <text x="28" y="42" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">=u Financial Crime Investigator</text>
    <text x="28" y="82" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="22">Searches clients, transactions, policy, and media</text>
